services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-undernight}
      POSTGRES_USER: ${POSTGRES_USER:-undernight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undernight_dev_password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-undernight} -d ${POSTGRES_DB:-undernight}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - undernight

  api:
    build:
      context: ./apps/api
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host ${API_HOST:-0.0.0.0}
      --port ${API_PORT:-8000}
      "
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://undernight:undernight_dev_password@postgres:5432/undernight}

      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}

    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - undernight

volumes:
  postgres-data:

networks:
  undernight:
    driver: bridge